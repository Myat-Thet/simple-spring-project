<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Student List</title>
</head>
<body>
<h1>Student list</h1> 
<a href="/students/add-student">Add Student</a>
<br>
	<br>

	<table border="1">

		<thead>

			<tr>

				<th>ID</th>

				<th>Name</th>

			</tr>

		</thead>

		<tbody>

			<tr
				th:each="student : ${students}"
			>

				<td
					th:text="${student.id}"
				></td>

				<td
					th:text="${student.name}"
				></td>

			</tr>

		</tbody>

	</table>
</body>
</html>
